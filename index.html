<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EFT Season 2 Modifier Builder | Dr.TAKOV</title><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#101715;color:#edf1e8}body{margin:0 auto;max-width:1080px;padding:18px}h1{font-size:clamp(22px,4vw,36px);margin-bottom:5px}p,.muted{color:#abb7ae}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:sticky;top:0;background:#101715ed;padding:12px 0;z-index:2}.stat{background:#24302a;border-radius:12px;text-align:center;padding:12px}.stat strong{display:block;font-size:26px}.green{color:#7bd9a0}.red{color:#f39b93}.columns{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{background:#1b2520;border:1px solid #35463a;border-radius:14px;padding:12px}.item{border-bottom:1px solid #334138;padding:12px 0;overflow-wrap:anywhere}.item:last-child{border:0}.item label{display:flex;gap:8px;align-items:start;cursor:pointer;font-weight:650}.item input{width:18px;height:18px;flex-shrink:0;accent-color:#79c99a}.points{font-size:12px;color:#9eaea1}.desc{font-size:12px;color:#b5c3b8;margin:5px 0 0 26px;line-height:1.5}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}button,input[type=search]{background:#293a30;color:white;border:1px solid #54705b;border-radius:9px;padding:10px;font:inherit}button{cursor:pointer}button:hover{background:#3d5345}input[type=search]{flex:1;min-width:170px}.note{font-size:12px;line-height:1.6}.hidden{display:none}@media(max-width:500px){body{padding:10px}.columns{gap:7px}.panel{padding:8px}.item{padding:9px 0}.item label{font-size:12px}.desc{font-size:11px;margin-left:0}.stat strong{font-size:20px}}</style></head><body><h1>EFT Season 2 Modifier Builder</h1><p>Dr.TAKOV | モディファイア全56種類・左右2列チェック式</p><div class="stats"><div class="stat">獲得<strong id="earned" class="green">0</strong></div><div class="stat">消費<strong id="spent">0</strong></div><div class="stat">残り<strong id="remaining">0</strong></div></div><div class="controls"><input type="search" id="search" placeholder="名前・効果を検索"><button id="descs">効果説明 ON/OFF</button><button id="reset">リセット</button><button id="share">構成を共有</button><button id="copy">構成をコピー</button></div><div class="columns"><section class="panel"><h3 class="green">プラス特性 (31)</h3><div id="buffs"></div></section><section class="panel"><h3 class="red">マイナス特性 (25)</h3><div id="debuffs"></div></section></div><p class="note">※2026年11月21日照合：11月19日EFT日本語公式発表を基にしたBaskMedia・Raison Detreの11月20日付一覧と、全56種の名称・ポイントを照合済み。効果説明は要約です。シーズン開始前に変更される可能性があります。ポイント以外の選択制限は未検証です。ラッキー等の効果は未公開。ゲーム運営元とは無関係のファン制作ツールです。</p><script>
const buffs=[['鍵師',1,'マルチツールでドアやコンテナの南京錠をピッキング可能'],['強化セキュアコンテナ',2,'Epsilon X所持で開始。死亡後も収納品のFiR維持'],['窃盗症',2,'サーチLv40開始、成長速度＋100%'],['変温動物',4,'体温低下によりサーマルで視認されにくい'],['マラソンランナー',5,'腕・脚のスタミナ消費−25%'],['ジュースタイム',1,'ジュースで240秒の鎮痛効果'],['みかじめ料',2,'週1回Scavから多額の支払い'],['ヘラクレス',6,'筋力・持久力Lv20開始'],['天才',4,'全スキル成長速度＋20%'],['骨太',2,'骨折確率−50%、落下ダメージ−30%'],['ラッキー',1,'幸運は勇者を好む！（具体的効果は非公開）'],['内気',1,'ソロ時スキル成長速度＋30%'],['高速クラフト',2,'クラフトLv40開始、成長速度＋100%'],['友人の脱出',2,'PMCレイドごとにScav用脱出地点を1つ追加利用可能（マップに存在する場合のみ）'],['高度なハイドアウト',4,'ビットコインファーム、ジム、Scavケースなど建設済み'],['金庫破り',4,'物理キー使用時50%で耐久減少なし'],['船乗りのノスタルジア',2,'魚缶詰で600秒間体力回復＋1'],['THE TARKOV SHOOTER',2,'ボルトアクションライフルスキルLv51開始'],['スプリンター',4,'ダッシュ速度＋15%'],['寡飲症',2,'水分消費−50%'],['平均',8,'全スキルLv30開始、それ以上成長不可'],['タップ、ラック、ロール',1,'トラブルシューティングLv40で開始。故障修復時に武器を確認する動作が不要'],['REFの建設業者',2,'GPコイン・Legaメダルでハイドアウトゾーン建設'],['ヘビー級',2,'移動速度−5%、最大運搬重量＋30kg、重量超過基準＋5kg'],['PEACEKEEPERの保険',4,'Peacekeeperがユーロで保険を提供'],['茂みの住人',4,'草むら移動音と移動速度低下を75%軽減'],['若さ',6,'エネルギー消費−20%、腕・脚スタミナ＋25'],['ダイエット',1,'食料品の消費量−50%'],['血栓症',6,'出血確率−100%'],['多食症',2,'エネルギー消費−45%'],['KAPPAプロトコル',8,'Kappaコンテナ所持で開始']];
const debuffs=[['社交的',3,'ソロ時スキル成長速度−30%'],['おしゃべり',2,'行動時にランダムでボイスラインを発する'],['ZERO TO HERO',2,'ボーナスアイテムなしで開始'],['デッドライン',4,'30日以内にエンディング未到達ならシーズンキャラ初期化'],['骨粗しょう症',2,'骨折確率＋50%、落下ダメージ＋50%'],['不器用',8,'スキル成長速度−100%'],['空っぽな人間',6,'カリスマ成長不可。全トレーダーの商品・サービス価格＋50%'],['壊れたセキュアコンテナ',6,'現金・鍵・ドッグタグ・特殊装備・一部コンテナ・バトルパス文書のみ収納可能'],['アンラッキー',1,'幸運は勇者を好む！（具体的効果は非公開）'],['幻覚症',2,'時折幻聴が聞こえる'],['三本指',2,'リロード時15%でマガジン落下'],['震えるエイム',3,'3秒以上のエイムで震え・痛み・視野狭窄'],['血液凝固障害',3,'出血が即座に重出血へ変化'],['疲労困憊',5,'腕・脚スタミナ−20'],['多飲症',1,'水分消費＋25%'],['ジキル博士',2,'生傷状態はレイド終了まで治療不可'],['フリーマーケット利用不可',8,'プレイヤー間フリマ取引不可'],['修理不可',2,'トレーダーによる修理不可'],['FENCEからの寵愛なし',2,'Fence信頼度−7.0開始'],['SCAV出撃不可',3,'Scavとして出撃不可'],['血友病',2,'出血確率＋70%'],['痛いじゃないか！',1,'医療品消費＋33%'],['慢性疲労症候群',1,'エネルギー消費＋20%'],['アレルギー',2,'食料・医療品からランダム4品にアレルギー'],['第三の足',1,'移動速度−2%、Therapist購入価格−5%']];
const $=id=>document.getElementById(id);let selectedB=new Set(),selectedD=new Set(),showDesc=true;try{const p=new URLSearchParams(location.search);(p.get('b')||'').split(',').forEach(v=>{let i=+v;if(v!==''&&buffs[i])selectedB.add(i)});(p.get('d')||'').split(',').forEach(v=>{let i=+v;if(v!==''&&debuffs[i])selectedD.add(i)})}catch(e){}
function render(){const q=$('search').value.toLowerCase();[['buffs',buffs,selectedB,-1],['debuffs',debuffs,selectedD,1]].forEach(([id,items,selected,sign])=>{const root=$(id);root.replaceChildren();items.forEach(([name,pts,desc],i)=>{if(!(name+desc).toLowerCase().includes(q))return;const box=document.createElement('div');box.className='item';const label=document.createElement('label');const check=document.createElement('input');check.type='checkbox';check.checked=selected.has(i);check.addEventListener('change',()=>{check.checked?selected.add(i):selected.delete(i);update()});const txt=document.createElement('span');txt.textContent=name;label.append(check,txt);const pt=document.createElement('div');pt.className='points';pt.textContent=(sign===1?'+':'−')+pts+' pt';const description=document.createElement('div');description.className='desc'+(showDesc?'':' hidden');description.textContent=desc;box.append(label,pt,description);root.append(box)})});update()}
function update(){const e=[...selectedD].reduce((s,i)=>s+debuffs[i][1],0),s=[...selectedB].reduce((s,i)=>s+buffs[i][1],0);$('earned').textContent='+'+e;$('spent').textContent='−'+s;$('remaining').textContent=(e-s>0?'+':'')+(e-s);$('remaining').className=e-s>=0?'green':'red'}
function shareUrl(){const url=new URL(location.href);url.searchParams.set('b',[...selectedB].sort((a,b)=>a-b).join(','));url.searchParams.set('d',[...selectedD].sort((a,b)=>a-b).join(','));return url.href}
function summary(){return 'EFT Season 2 | Dr.TAKOV\nバフ: '+[...selectedB].map(i=>buffs[i][0]).join('、')+'\nデバフ: '+[...selectedD].map(i=>debuffs[i][0]).join('、')+'\n'+shareUrl()}
$('search').addEventListener('input',render);$('descs').onclick=()=>{showDesc=!showDesc;render()};$('reset').onclick=()=>{selectedB.clear();selectedD.clear();render()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(summary());alert('構成をコピーしました')}catch(e){prompt('構成をコピーしてください',summary())}};$('share').onclick=()=>{const u='https://twitter.com/intent/tweet?'+new URLSearchParams({text:'EFT Season 2のモディファイア構成を作ってみた！ #EscapefromTarkov',url:shareUrl()});window.open(u,'_blank','noopener,noreferrer')};render();
</script></body></html>
